name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Create Android project (if not committed)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Allow http:// streams (cleartext traffic)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q usesCleartextTraffic $M || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' $M
          grep -n "usesCleartextTraffic" $M

      - name: Add Firebase config and Google Services plugin
        run: |
          cp google-services.json android/app/google-services.json
          if ! grep -q "com.google.gms:google-services" android/build.gradle; then
            sed -i "/classpath 'com.android.tools.build:gradle/a\\        classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
          fi
          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi
          grep -n "google" android/build.gradle android/app/build.gradle || true

      - name: Patch MainActivity (no overscroll stretch, no native scrollbars)
        run: |
          DIR=android/app/src/main/java/com/blaze/vion
          mkdir -p $DIR
          cat > $DIR/MainActivity.java <<'JAVA'
          package com.blaze.vion;

          import android.os.Bundle;
          import android.view.View;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  View web = getBridge().getWebView();
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  web.setVerticalScrollBarEnabled(false);
                  web.setHorizontalScrollBarEnabled(false);
              }
          }
          JAVA

      - name: Generate icons and splash (if assets/ exists)
        if: ${{ hashFiles('assets/icon-only.png') != '' }}
        run: npx capacitor-assets generate --android

      - name: Sync web build into Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/Vion-debug.apk

      - name: Build signed release APK (only if keystore secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No keystore secrets set, skipping signed release build."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/vion.jks
          (cd android && ./gradlew assembleRelease)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -f -p 4 "$UNSIGNED" $RUNNER_TEMP/aligned.apk
          $BT/apksigner sign \
            --ks $RUNNER_TEMP/vion.jks \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out $GITHUB_WORKSPACE/Vion-release.apk \
            $RUNNER_TEMP/aligned.apk
          $BT/apksigner verify $GITHUB_WORKSPACE/Vion-release.apk

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vion-apk
          path: Vion-*.apk

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Vion-*.apk
